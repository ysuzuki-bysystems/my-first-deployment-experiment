# yaml-language-server: $schema=https://nfpm.goreleaser.com/static/schema.json
name: "my-first-deployment-experiment"
arch: "amd64"
platform: "linux"
version: "0.0.1"
release: "0" # 内容を改変するごとに `release` または `version` を上げる
depends:
  - podman
maintainer: "Na-nashi no Gonbe sann <dummy@example.com>" # パッケージャの名前は必須らしい
description: "My first deployment experiment." # DeepL で直訳した
license: "UNLICENSED"
contents:
  - # Global user profile
    src: ./etc/profile.d/
    dst: /etc/profile.d/
  - # Polkit
    src: ./etc/polkit-1/rules.d/
    dst: /etc/polkit-1/rules.d/
  - # Quadlet ファイル群
    src: ./etc/containers/systemd/
    dst: /etc/containers/systemd/
  - # systemd 設定ファイル群
    src: ./etc/systemd/system/
    dst: /etc/systemd/system/
  - # podman.service の上書き
    dst: /etc/systemd/system/podman.socket.d/
    type: dir
  -
    src: ./etc/systemd/system/podman.socket.d/
    dst: /etc/systemd/system/podman.socket.d/
  - # 環境ファイル
    src: ./etc/sysconfig/test-app
    dst: /etc/sysconfig/test-app
    type: config # RPM インストール時に内容を上書きしない
    file_info:
      mode: 0664
      group: adm
  - # bin
    src: ./usr/local/bin/
    dst: /usr/local/bin/
    file_info:
      mode: 0775
  - # コンテナイメージ格納ディレクトリ
    dst: /usr/local/share/test
    type: dir
    file_info:
      mode: 0775
      group: adm # adm グループ書き込み可にする
  - # 手順を簡易にするため、 test-proxy (Caddy) を RPM に含めてしまう。実際は test-app と同様にコピーしてデプロイする。
    src: ./usr/local/share/test/test-proxy.tar.xz
    dst: /usr/local/share/test/test-proxy.tar.xz
scripts:
  postinstall: ./scripts/postinstall.sh # インストール時に `systemctl daemon-reload` を実行する
  preremove: ./scripts/preremove.sh
